{% extends "base.html" %}
{% from "partials/_icons.html" import icon %}
{% block title %}Dashboard — GreenGrowth{% endblock %}
{% block content %}
<div class="w-full px-8 py-8 md:px-12">
  <div class="mb-1 flex items-center justify-between">
    <h1 class="font-heading text-2xl font-semibold text-ink">Dashboard</h1>
    <button type="button" title="Toggle light / dark theme"
      onclick="var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); localStorage.setItem('gg-theme',t);"
      class="theme-toggle flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-paper-line text-ink-soft transition-colors hover:bg-paper hover:text-ink">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
  <div id="queue-panel">
    {% include "partials/queue.html" %}
  </div>
</div>
{% endblock %}
